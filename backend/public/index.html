<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Restaurantes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            accent: '#a5b4fc',
          },
          boxShadow: {
            glass: '0 8px 32px 0 rgba(31, 38, 135, 0.18)',
          },
        },
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .fade-in { animation: fadeIn 0.7s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-indigo-100 min-h-screen">
  <header class="sticky top-0 z-30 bg-white/70 backdrop-blur shadow-md py-4 mb-8 transition-all">
    <div class="container mx-auto flex flex-col md:flex-row items-center justify-between px-4">
      <div class="flex items-center gap-3">
        <svg class="w-10 h-10 text-primary drop-shadow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 21h16M4 17V5a2 2 0 012-2h12a2 2 0 012 2v12M9 21V9h6v12"/></svg>
        <h1 class="text-3xl font-extrabold text-primary tracking-tight drop-shadow">Gestión de Restaurantes</h1>
      </div>
      <button id="reload-btn" class="mt-4 md:mt-0 bg-primary hover:bg-indigo-700 text-white px-5 py-2 rounded-lg shadow transition font-semibold flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582M20 20v-5h-.581M5 19A9 9 0 1119 5"/></svg>Recargar</button>
    </div>
  </header>
  <main class="container mx-auto px-4 fade-in">
    <div id="messages" class="mb-4"></div>
    <section id="restaurant-list" class="mb-10"></section>
    <section id="restaurant-form" class="max-w-lg mx-auto"></section>
  </main>
  <footer class="text-center text-gray-400 py-6 mt-10 text-xs tracking-wide select-none">
    <span class="opacity-80">&copy; 2024 Gestión de Restaurantes. UI profesional mejorada.</span>
  </footer>

  <!-- Modal para detalles y edición -->
  <div id="modal-bg" class="hidden fixed inset-0 bg-black/40 z-40 flex items-center justify-center transition-all"></div>
  <div id="modal" class="hidden fixed z-50 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-indigo-100"></div>

  <script src="app.js"></script>
</body>
</html>
